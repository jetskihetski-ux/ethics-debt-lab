[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ethics-debt-lab"
version = "0.1.0"
description = "Synthetic red-team simulator for consumer-hostile insurance ML strategies"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ethics Debt Lab contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
]

[project.scripts]
ethics-debt-lab = "ethics_debt_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
